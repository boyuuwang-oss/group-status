<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>3dCFT.com</title>
  <meta name="description" content="3dCFT.com: interactively solving conformal field theory in three dimensions. Status page of a research group.">
  <link rel="icon" href="assets/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/mark-180.png">
  <script>/* a member opening a page other than home goes straight to the light page: skip the navy wait */
    try { const k = Object.keys(localStorage).concat(Object.keys(sessionStorage)).some((x) => x.startsWith('rs-key:'));
      if (k && !/^(#\/?(home)?)?$/.test(location.hash)) document.documentElement.classList.add('member'); } catch (_) { /* no storage */ }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=8e4b928fa19f">
</head>
<body class="booting">
  <header class="top">
    <a class="brand" href="#/home" aria-label="3dCFT.com: home">
      <img class="brand-mark" src="assets/mark-180.png" alt="" width="46" height="46">
      <span class="wordmark"><span class="d">3d</span>CFT<span class="com">.com</span></span>
      <span class="mark" id="brand-title"></span>
      <span class="tagline" id="tagline"></span>
    </a>
    <nav class="nav" aria-label="Views">
      <a href="#/live" data-view="live">Live</a>
      <a href="#/agents" data-view="agents">Agents</a>
      <a href="#/map" data-view="map">Map</a>
      <a href="#/paper" data-view="paper">Paper</a>
      <a href="#/activity" data-view="activity">Activity</a>
    </nav>
    <div class="top-right">
      <a class="btn-ghost" id="repo-link" href="#" target="_blank" rel="noopener" hidden>GitHub</a>
      <button class="btn-ghost" id="lock" type="button" hidden title="Forget the password on this device">Lock</button>
      <button class="btn-icon" id="theme" type="button" aria-label="Switch light or dark theme" title="Light / dark">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15z" fill="currentColor"/><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </header>
  <div class="ticker" id="ticker" hidden></div>
  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Details" hidden></aside>
  <footer class="foot" id="foot"></footer>
  <script>window.SITE_BUILD = "8e4b928fa19f";</script>
  <script src="assets/app.js?v=8e4b928fa19f"></script>
</body>
</html>
